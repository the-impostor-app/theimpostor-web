# IMPORTANT: This repo must be configured to use "GitHub Actions" as the
# Pages source (Settings → Pages → Build and deployment → Source).
# If set to "Deploy from a branch", GitHub's built-in pages-build-deployment
# workflow will deploy the raw source whenever this custom workflow fails,
# breaking the live site.
# This workflow cancels those competing runs as a safety net,
# but the proper fix is the Pages source setting.

name: Deploy static content to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cancel competing pages-build-deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow=pages-build-deployment --status=in_progress --limit 10 --json databaseId -q '.[].databaseId' 2>/dev/null || echo '')
          if [ -n "$runs" ]; then
            for id in $runs; do
              gh run cancel "$id" 2>/dev/null || true
            done
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier
        run: npm run format:check

      - name: Lint (oxlint + eslint)
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build-only

      # GitHub Pages SPA trick: every route gets a real HTML file (SEO +
      # direct URL access), and 404.html doubles as the SPA fallback.
      - name: Stage route files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          for route in how-to-play game-modes word-packs blog download privacy terms the-impostor/policy the-impostor/terms-and-conditions \
            blog/what-is-social-deduction-game blog/que-es-juego-deduccion-social \
            blog/best-party-games-large-groups blog/mejores-juegos-fiesta-grupos-grandes \
            blog/impostor-vs-spyfall blog/impostor-vs-spyfall-es \
            blog/how-to-host-game-night blog/como-organizar-noche-juegos \
            blog/best-offline-party-games blog/mejores-juegos-fiesta-sin-internet; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Validate Pages artifact
        run: |
          test -f dist/index.html || (echo "MISSING dist/index.html" && exit 1)
          test -f dist/404.html || (echo "MISSING dist/404.html" && exit 1)
          test -f dist/.nojekyll || (echo "MISSING dist/.nojekyll" && exit 1)
          for route in how-to-play game-modes word-packs blog download privacy terms the-impostor/policy the-impostor/terms-and-conditions; do
            test -f "dist/$route/index.html" || (echo "MISSING dist/$route/index.html" && exit 1)
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Create Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            -C dist .
          echo "Total files in artifact:"
          tar -tf "$RUNNER_TEMP/artifact.tar" | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cancel lingering pages-build-deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow=pages-build-deployment --status=in_progress --limit 10 --json databaseId -q '.[].databaseId' 2>/dev/null || echo '')
          if [ -n "$runs" ]; then
            for id in $runs; do
              gh run cancel "$id" 2>/dev/null || true
            done
            sleep 10
          fi

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait and cancel competing runs (before retry 1)
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          runs=$(gh run list --workflow=pages-build-deployment --status=in_progress --limit 10 --json databaseId -q '.[].databaseId' 2>/dev/null || echo '')
          if [ -n "$runs" ]; then
            for id in $runs; do
              gh run cancel "$id" 2>/dev/null || true
            done
          fi

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait and cancel competing runs (before retry 2)
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Smoke test live Pages site
        if: steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success'
        run: |
          PAGE_URL="${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}"
          echo "Checking ${PAGE_URL}"
          for path in "" "how-to-play/" "game-modes/" "word-packs/" "blog/" "download/" "privacy/" "terms/"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "${PAGE_URL}${path}")
            echo "GET ${PAGE_URL}${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "Smoke test failed for ${path}"
              exit 1
            fi
          done
